# Talky Settings — set your preferred llm_backend and voice_profile
defaults:
  llm_backend: "openclaw"
  voice_profile: "default"
  talky_profile: "openclaw"

# Network settings
network:
  # See docs/ports.md — the canonical port truth.
  host: "0.0.0.0"            # remote (HTTPS) bind host. "0.0.0.0" = all interfaces.
  external_host: ""          # External hostname for browser URLs (e.g. macbook.tailnet.ts.net)

  # Two listeners, named by reach:
  #
  # local_port  — ALWAYS bound. Plain HTTP on 127.0.0.1. Serves the one app
  #               (web client + API + MCP) to the local browser and local MCP
  #               clients (Claude Code, etc.). Pinned to 8765 so a static MCP
  #               config (.mcp.json) and bookmarks have a stable target. Set to
  #               null / comment out to pick a random free port instead, written
  #               to ~/.talky/run/talky-daemon.local-port for discovery.
  local_port: 8765

  # remote_port — bound ONLY when a TLS cert resolves (see https: below).
  #               HTTPS on `host` for off-box reach (LAN, mobile, ngrok).
  #               Omit/comment → random free port, written to
  #               ~/.talky/run/talky-daemon.remote-port.
  # remote_port: 8764

  # https:                   # Uncomment to serve the remote HTTPS listener
  #   cert: "~/.talky/ssl/server-cert.pem"   # (run `talky certs` first)
  #   key:  "~/.talky/ssl/server-key.pem"

# Audio cues — the short three-beep tones played on mic open/close and on
# request_leave. Set ``enabled: false`` for a quieter experience. Env var
# ``TALKY_AUDIO_CUES=0`` overrides this at runtime.
audio_cues:
  enabled: true
