# LLM Backends — each needs service_class (dotted import path), config.
# Optional `announcement` is an impersonal system cue spoken when the user
# *manually* switches to this profile in the picker (e.g. "Pi channel").
# It's a "channel changed" UX cue, not a greeting from the agent. Agents that
# join via the /ws/agent extension speak their own greeting through the TTS
# stream — no system announcement fires on that path. Tickets 8c9d, e540.
# Optional `greeting` is the *instruction* handed to the agent on /ws/agent
# connect so the agent generates its own greeting words. Set to "__none__"
# to disable. Omit either field for the default behavior. Ticket 5d95.
llm_backends:
  # Echo — deterministic fake LLM for E2E thread testing (ticket 0179).
  # Repeats the user's transcript back as the assistant response, so a test
  # can drive the real pipeline end-to-end (STT -> LLM -> TTS) and assert that
  # language + audio came out. No inference, no network, no cost. Used by
  # tests/browser/drive_call.py — see tests/browser/README.md.
  echo:
    description: "Echo — deterministic E2E test backend"
    service_class: "talky.backends.echo.EchoLLMService"
    config:
      template: "you said: {text}"
  # Script — echo's sibling for UI conformance tests (WIN-536). Plays the
  # [[directive]] script written in the user's turn: streamed tokens, tool
  # calls, reasoning, code, empty replies, failures. See backends/script.py.
  script:
    description: "Script — deterministic UI test backend"
    service_class: "talky.backends.script.ScriptLLMService"
    config:
      token_delay_s: 0.08
  moltis:
    description: "Moltis - Anthropic Claude"
    service_class: "talky.backends.moltis.MoltisLLMService"
    announcement: "Moltis channel."
    config:
      model: "claude-3-5-sonnet-20241022"
      api_key: ""  # Will be loaded from credentials
      session_key: "agent:main:main"  # Default session key
  agent-ext:
    description: "Agent extension bridge (WebSocket, any agent CLI)"
    service_class: "talky.server.agent_ext.AgentExtensionLLMService"
    # No announcement — the agent speaks its own greeting via the TTS stream.
    config: {}
  pi:
    description: "Pi coding agent (RPC mode, interruptible)"
    service_class: "talky.backends.pi_rpc.PiRPCLLMService"
    announcement: "Pi channel."
    config: {}
  claude-code:
    description: "Claude Code via Agent SDK (thread bridge, turn-boundary interrupt)"
    service_class: "talky.backends.claude_code.ClaudeCodeLLMService"
    extra: "claude-code"
    announcement: "Claude here."
    config:
      permission_mode: "acceptEdits"
      max_turns: 10
      cwd: null
  hermes:
    description: "Hermes agent (NousResearch) via thread bridge, mid-tool interrupt"
    service_class: "talky.backends.hermes.HermesLLMService"
    announcement: "Hermes channel."
    config:
      cwd: null
      max_turns: 90
  devin:
    description: "Devin CLI via ACP (devin acp, interruptible, resumable)"
    service_class: "talky.backends.devin.DevinACPLLMService"
    announcement: "Devin channel."
    config:
      mode: "accept-edits"
      model: null
      cwd: null
      binary: null
      cloud: false
  opencode:
    description: "Opencode (sst/opencode) via HTTP server, streaming + permission asks"
    service_class: "talky.backends.opencode.OpencodeLLMService"
    extra: "opencode"
    announcement: "Opencode channel."
    config:
      # Where opencode serve is listening. Auto-spawned if auto_spawn=true and nothing answers.
      base_url: "http://127.0.0.1:4096"
      auto_spawn: true
      cwd: null
      # Leave provider_id/model_id null to defer to opencode's /config defaults.
      provider_id: "opencode"
      model_id: "claude-haiku-4-5"
      # Per-session permission ruleset. Each entry: {permission, pattern, action}
      # where action ∈ allow|deny|ask. Empty list = no asks.
      permissions:
        - {permission: "bash", pattern: "*", action: "ask"}
        - {permission: "edit", pattern: "*", action: "ask"}
