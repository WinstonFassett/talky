# Core Talky Profiles - authoritative combinations for all users
# Users can disable these in their personal ~/.talky/talky-profiles.yaml
talky_profiles:

  # Echo — deterministic E2E thread test profile (ticket 0179). Background.
  # Pairs with the `echo` llm_backend and (by convention) the `local-test`
  # voice profile. Used by tests/browser/drive_call.py — see its README.
  echo:
    description: "Echo (E2E test backend)"
    llm_backend: "echo"

  # OpenClaw
  openclaw:
    description: "OpenClaw"

  # Moltis
  moltis:
    description: "Moltis"
    llm_backend: "moltis"

  # Pi coding agent (RPC mode, interruptible)
  pi:
    description: "Pi"
    llm_backend: "pi"

  # Claude — background (Agent SDK) and foreground (CLI) variants are defined
  # in the defaults template, following the standard `<agent>` / `<agent>-tui`
  # naming convention. The Agent SDK (claude-code-sdk) wraps the `claude` CLI
  # and uses the Claude Code subscription OAuth login by default, so both
  # variants bill against the Pro/Max/Team subscription — no separate API key
  # charges.

  # Hermes agent (NousResearch) — background, thread bridge, mid-tool interrupt
  hermes:
    description: "Hermes"
    llm_backend: "hermes"

  # Opencode (sst/opencode) — HTTP server backend with first-class permission asks
  opencode:
    description: "Opencode"
    llm_backend: "opencode"

