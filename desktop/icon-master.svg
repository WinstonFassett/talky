<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Talky app icon — white speech-bubble + voice waveform on the accent-blue
       squircle. Derived from client/public/favicon.svg. Master at 1024px;
       downscaled to the .icns / .ico / PNG set. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cb8"/>
      <stop offset="1" stop-color="#4a7ba8"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle background (corner radius ~22.5% per Apple's grid) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Mark group: the favicon's 32px artwork scaled up and centered.
       Original viewBox 0..32; scale 22 → 704px, translate to center
       (1024-704)/2 = 160. -->
  <g transform="translate(160,160) scale(22)" fill="none"
     stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <!-- Speech bubble -->
    <path d="M4 6 Q4 3 7 3 L25 3 Q28 3 28 6 L28 20 Q28 23 25 23 L14 23 L8 28 L9 23 L7 23 Q4 23 4 20 Z"
          stroke-width="2.2"/>
    <!-- Voice waveform inside -->
    <line x1="9"  y1="13" x2="9"  y2="13" stroke-width="2"/>
    <line x1="12" y1="10" x2="12" y2="16" stroke-width="2"/>
    <line x1="15" y1="7"  x2="15" y2="19" stroke-width="2"/>
    <line x1="18" y1="9"  x2="18" y2="17" stroke-width="2"/>
    <line x1="21" y1="11" x2="21" y2="15" stroke-width="2"/>
    <line x1="24" y1="13" x2="24" y2="13" stroke-width="2"/>
  </g>
</svg>
