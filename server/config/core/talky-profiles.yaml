# Core Talky Profiles - authoritative combinations for all users
# Users can disable these in their personal ~/.talky/talky-profiles.yaml
talky_profiles:

  # OpenClaw
  openclaw:
    description: "OpenClaw"

  # Moltis
  moltis:
    description: "Moltis"
    llm_backend: "moltis"

  # Pi coding agent (RPC mode, interruptible)
  pi:
    description: "Pi"
    llm_backend: "pi"

  # NOTE: bare `claude` is intentionally NOT defined here as a background SDK
  # profile. The Agent SDK is billed as separate API usage on top of the
  # Claude Code subscription. The defaults template binds `claude` to the
  # foreground CLI instead (subscription billing) as an exception to the
  # `<agent>` = background naming convention. A `claude-bg` SDK entry is
  # provided commented-out in defaults for users who want to opt in.

  # Hermes agent (NousResearch) — background, thread bridge, mid-tool interrupt
  hermes:
    description: "Hermes"
    llm_backend: "hermes"

  # Opencode (sst/opencode) — HTTP server backend with first-class permission asks
  opencode:
    description: "Opencode"
    llm_backend: "opencode"

